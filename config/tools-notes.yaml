# Notas de herramientas para docs/TOOLS.md (01-1, regla 7, y 7.24). Las lee scripts/gen_docs.py; no edites TOOLS.md.
#
# - temas: por qué un flag temático (core/flags.py, THEMATIC_TOOLS) apaga sus herramientas y qué hace falta para
#   encenderlo. Cada flag con herramientas tiene que tener su motivo.
# - herramientas: motivo de cada herramienta apagada por defecto (ToolSpec.default_enabled=False, D-134) o que el
#   propietario deba conocer. gen_docs falla si una herramienta apagada por defecto no tiene motivo aquí.
# - fuera_de_alcance: lo que 7.24 deja fuera, con lo que haría falta para hacerlo.
# - mejoras: mejoras posteriores que la especificación pide anotar en TOOLS.md.
# - fases: fases cerradas y en curso para la cabecera de TOOLS.md. La actualiza el lote que cierra o abre una fase
#   (F3-Z, F4-Z...), igual que docs/PLAN.md.
fases:
  cerradas: [F1, F2, F5 sin vídeo]
  en_curso: [F3, F4]
temas:
  HEVC_DECODE_ENABLED: >-
    Decodificar HEVC (HEIC y vídeo H.265) puede necesitar licencia de patentes, también como servicio en la nube
    (7.2 y 11). Apagado hasta la revisión legal anotada en docs/LEGAL.md; mientras tanto, la página explica cómo
    exportar a JPEG desde el iPhone o el Mac y lleva noindex.
  INVOICING_ES_ENABLED: >-
    Las herramientas que generan facturas son un sistema informático de facturación (Veri*factu, RD 1007/2023) y
    tocan la factura electrónica obligatoria (RD 238/2026). Apagado hasta la revisión con un asesor anotada en
    docs/LEGAL.md (7.23). Las que validan o muestran facturas no dependen de este flag.
herramientas:
  hacer-pdf-rellenable: >-
    Apagada mientras se termina F4-B1: el motor de campos del navegador (pdf-lib) y los campos de firma con pyHanko en
    `workerpdf` ya están, falta el diseñador en la página.
  crear-formulario-pdf: >-
    Apagada mientras se termina F4-B1, como hacer-pdf-rellenable, que es la misma herramienta empezando en blanco.
  firmar-pdf: >-
    Apagada hasta F4-B: el sello de la plataforma en servidor (PAdES B-T a B-LTA, DocMDP, firma visible) ya funciona
    en `workersign` (F4-A2, D-188), pero A.6 pide además la firma dibujada, escrita, subida o con la cámara en el
    navegador y la firma interrumpida con certificado propio, que llegan en F4-B. Para probar el sello antes:
    TOOL_FIRMAR_PDF_ENABLED=true, con el token, SIGN_CERT_PATH y TSA_URL configurados (DEPLOY-CHECKLIST).
fuera_de_alcance:
  - formato: XPS, PostScript/EPS y PDF/X
    motivo: Dependen de Ghostscript o MuPDF (AGPL, 11).
    posible: Con licencia comercial de Ghostscript o MuPDF, o tras revisión legal.
  - formato: Laminar modelos 3D a G-code
    motivo: PrusaSlicer, OrcaSlicer, Bambu Studio y CuraEngine son AGPL (11).
    posible: Con un laminador con licencia comercial, o tras revisión legal.
  - formato: Archivos laminados para resina (CTB, PWMX, GOO, SL1 y similares)
    motivo: La herramienta de referencia, UVtools, es AGPL, y CTB va cifrado.
    posible: Con licencia comercial o un SDK del fabricante, tras revisión legal.
  - formato: CAD propietario (SLDPRT, F3D, IPT, CATPart)
    motivo: Sin SDK comercial no se pueden leer.
    posible: Con el SDK comercial de cada fabricante.
  - formato: Quitar DRM, convertir certificados con clave privada y descargar de YouTube o redes sociales
    motivo: Fuera de alcance por motivos legales y de seguridad (7.24).
    posible: No se contempla.
mejoras:
  - "escribir-pdf: sincronizar los borradores y versiones con la cuenta (hoy solo en IndexedDB del navegador, A.1)."
  - "Extensión para Chrome equivalente a la de PDF24 (7.23, «No aplica»)."
