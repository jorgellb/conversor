# Paridad con PDF24 (0.8, 7.23 y 17): cada herramienta web de tools.pdf24.org y su equivalente aquí.
# Lista tomada de https://tools.pdf24.org/en/all-tools el 14/11/2026; la paridad es de funciones, nunca de textos,
# diseño ni marca. scripts/gen_docs.py la publica en docs/TOOLS.md con el estado de cada equivalente. Claves:
# - equivalentes: slugs del registro; «slug:Fn» si aún no está y llega en esa fase.
# - paginas: páginas fijas de la web (apps/web/src/lib/site.ts, STATIC_PAGES).
# - nota: explicación cuando no hay equivalente o no es evidente (17: «o una explicación de por qué no»).
