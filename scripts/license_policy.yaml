# Política de licencias (11). La aplica scripts/check_licenses.py en la CI.
frontend:
  allowed: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, MPL-2.0, Zlib, Unlicense, CC0-1.0, BlueOak-1.0.0, CC-BY-4.0, OFL-1.1, MIT-0]
backend:
  allowed: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, MPL-2.0, Zlib, Unlicense, CC0-1.0, BlueOak-1.0.0, PSF-2.0,
            Python-2.0, HPND, MIT-CMU, LGPL-2.1, LGPL-3.0, EPL-2.0, EUPL-1.2, LicenseRef-TOST-1.0, MIT-0, BSL-1.0, CNRI-Python,
            "Apache-2.0 WITH LLVM-exception"]
# Prohibidos siempre como paquete instalado (GPL solo como programa externo en servidor).
forbidden_patterns: ["AGPL", "GPL-2.0-only", "GPL-3.0-only", "GPL-2.0-or-later", "GPL-3.0-or-later", "GPLv2", "GPLv3", "GNU General Public"]
# `av` (PyAV) declara BSD-3-Clause, pero sus ruedas traen libx264 y libx265 (GPL) dentro de libavcodec (D-111).
forbidden_packages: [ghostscript, mupdf, pymupdf, fitz, pdf2docx, babeldoc, ebooklib, extract-msg, xmlsig, misaki, phonemizer-fork,
                     phonemizer, kokoro, kokoro-onnx, espeakng-loader,
                     pillow-heif, av, "@ffmpeg/core", "@ffmpeg/ffmpeg"]
# Equivalencias de nombres que publican los paquetes (texto libre → SPDX).
aliases:
  "MIT License": MIT
  "MIT license": MIT
  "The MIT License": MIT
  "Apache Software License": Apache-2.0
  "Apache License 2.0": Apache-2.0
  "Apache 2.0": Apache-2.0
  "Apache-2.0 OR MIT": MIT
  "MIT OR Apache-2.0": MIT
  "Apache-2.0 AND MIT": Apache-2.0
  "BSD License": BSD-3-Clause
  "BSD": BSD-3-Clause
  "3-Clause BSD License": BSD-3-Clause
  "BSD-3-Clause OR MIT": MIT
  "ISC License (ISCL)": ISC
  "Mozilla Public License 2.0 (MPL 2.0)": MPL-2.0
  "Python Software Foundation License": PSF-2.0
  "PSF License": PSF-2.0
  "Historical Permission Notice and Disclaimer (HPND)": HPND
  "GNU Lesser General Public License v3 (LGPLv3)": LGPL-3.0
  "GNU Lesser General Public License v3 or later (LGPLv3+)": LGPL-3.0
  "GNU Library or Lesser General Public License (LGPL)": LGPL-2.1
  "LGPL-3.0-or-later": LGPL-3.0
  "LGPL-3.0-only": LGPL-3.0
  "LGPL-2.1-or-later": LGPL-2.1
  "LGPL-2.1-only": LGPL-2.1
  "LGPLv3+": LGPL-3.0
  "MPL 2.0": MPL-2.0
  "(MIT OR CC0-1.0)": MIT
  "CC0": CC0-1.0
  "Apache": Apache-2.0
  "Apache 2.0 License": Apache-2.0
  "ISC License": ISC
  "(MIT OR Apache-2.0)": MIT
  "(BSD-2-Clause OR MIT OR Apache-2.0)": MIT
  "(MPL-2.0 OR Apache-2.0)": Apache-2.0
  "MIT AND Apache-2.0": Apache-2.0
  "Unlicense OR MIT": MIT
  "OFL-1.1": OFL-1.1
  "New BSD": BSD-3-Clause
  "PSFL": PSF-2.0
# Paquetes cuya licencia no se detecta bien en sus metadatos, comprobada a mano (paquete: licencia SPDX).
overrides:
  psycopg: LGPL-3.0
  psycopg-binary: LGPL-3.0
  img2pdf: LGPL-3.0
  pikepdf: MPL-2.0
  pypdfium2: Apache-2.0
  ocrmypdf: MPL-2.0
  pip-licenses: MIT
  prettytable: BSD-3-Clause
  typing-extensions: PSF-2.0
  urllib3: MIT
  certifi: MPL-2.0
  pillow: MIT-CMU
  python-dateutil: Apache-2.0
  "@img/sharp-libvips-linux-x64": LGPL-3.0
  "@img/sharp-libvips-linuxmusl-x64": LGPL-3.0
  caniuse-lite: CC-BY-4.0
  combine-errors: MIT  # sin campo license; License.md es MIT (dependencia de tus-js-client)
  py-rust-stemmers: MIT  # sin campo License en los metadatos; el README y LICENSE de la rueda dicen MIT (dependencia de fastembed)
  py_rust_stemmers: MIT
# Paquetes que solo se usan en desarrollo y pruebas y nunca llegan a una imagen.
dev_only: [pytest, respx, pip-licenses, prettytable, wcwidth, iniconfig, pluggy, pygments, fpdf2]
