# Producción en Coolify v4 (13.2): solo `image:` con etiquetas fijas, dominios por variables mágicas y sin `ports:`.
# Generado por scripts/gen_coolify_compose.py: edita el generador, no este archivo.
# Los servicios de fases posteriores (workerutils, workermesh, workercad y umami) se añaden con su
# fase.
# Memoria y CPU (5.4): `MEM_<NOMBRE>` cambia `mem_limit` y `memswap_limit` de postgres, gotenberg, gotenbergweb y cada
# worker, y `CPUS_<NOMBRE>` y `CONCURRENCY_<NOMBRE>`, los de cada worker. Por defecto, el perfil de 8 vCPU; el de
# 16 vCPU lo imprime `python scripts/gen_coolify_compose.py --profile 16` (docs/OPERATIONS.md).
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: conversor
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - internal
    mem_limit: ${MEM_POSTGRES:-2560m}
    memswap_limit: ${MEM_POSTGRES:-2560m}
    oom_score_adj: -500
    shm_size: 256m
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d conversor
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
  valkey:
    image: valkey/valkey:9.0.7-alpine
    restart: unless-stopped
    logging: *id001
    command:
    - valkey-server
    - --requirepass
    - ${SERVICE_PASSWORD_VALKEY}
    - --save
    - '60'
    - '1000'
    - --appendonly
    - 'no'
    - --maxmemory
    - 400mb
    - --maxmemory-policy
    - noeviction
    environment:
      VALKEY_PASSWORD: ${SERVICE_PASSWORD_VALKEY}
    volumes:
    - valkeydata:/data
    networks:
    - internal
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: -500
    healthcheck:
      test:
      - CMD-SHELL
      - valkey-cli -a $${VALKEY_PASSWORD} --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
  prepare:
    image: ghcr.io/${GHCR_OWNER:?Propietario del registro}/conversor-api:${IMAGE_TAG:?Etiqueta de imagen}
    restart: 'no'
    logging: *id001
    user: 0:0
    exclude_from_hc: true
    command:
    - sh
    - -c
    - mkdir -p /srv/files/uploads /srv/files/jobs /srv/files/shares /srv/backups/postgres && chown -R 10001:10001 /srv/files /srv/backups
    volumes:
    - filestore:/srv/files
    - backups:/srv/backups
    networks:
    - internal
  migrateauth:
    image: ghcr.io/${GHCR_OWNER:?Propietario del registro}/conversor-web:${IMAGE_TAG:?Etiqueta de imagen}
    restart: 'no'
    logging: *id001
    exclude_from_hc: true
    command:
    - node
    - migrate/migrate-auth.mjs
    environment:
      AUTH_DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/conversor
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
    networks:
    - internal
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    image: ghcr.io/${GHCR_OWNER:?Propietario del registro}/conversor-api:${IMAGE_TAG:?Etiqueta de imagen}
    restart: 'no'
    logging: *id001
    exclude_from_hc: true
    command:
    - alembic
    - -c
    - apps/api/alembic.ini
    - upgrade
    - head
    environment:
      SERVICE_ROLE: migrate
      DATABASE_URL: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/conversor
      WORKER_DB_PASSWORD: ${SERVICE_PASSWORD_WORKERDB}
    networks:
    - internal
    depends_on:
      prepare:
        condition: service_completed_successfully
      migrateauth:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  web:
    image: ghcr.io/${GHCR_OWNER:?Propietario del registro}/conversor-web:${IMAGE_TAG:?Etiqueta de imagen}
    restart: unless-stopped
    logging: *id001
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:?Nombre del producto}
      PUBLIC_WEB_URL: ${SERVICE_URL_WEB}
      PUBLIC_API_URL: ${SERVICE_URL_API}
      PUBLIC_UPLOAD_URL: ${SERVICE_URL_UPLOAD}/files/
      PUBLIC_FILES_URL: ${SERVICE_URL_FILES}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_URL: ${SMTP_URL:?URL SMTP}
      MAIL_FROM: ${MAIL_FROM:?Remitente}
      SERVICE_URL_WEB_3000: ''
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      AUTH_DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/conversor
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Clave pública de Turnstile}
      CLIENT_MAX_MB: ${CLIENT_MAX_MB:-100}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-52428800}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Correo del administrador}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-true}
      GDRIVE_ENABLED: ${GDRIVE_ENABLED:-false}
      GOOGLE_PICKER_CLIENT_ID: ${GOOGLE_PICKER_CLIENT_ID:-}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      DROPBOX_ENABLED: ${DROPBOX_ENABLED:-false}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
    networks:
    - internal
    - edge
    mem_limit: 1g
    memswap_limit: 1g
    cpu_shares: 2048
    oom_score_adj: -500
    user: 10001:10001
    depends_on:
      migrateauth:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  api:
    image: ghcr.io/${GHCR_OWNER:?Propietario del registro}/conversor-api:${IMAGE_TAG:?Etiqueta de imagen}
    restart: unless-stopped
    logging: *id001
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:?Nombre del producto}
      PUBLIC_WEB_URL: ${SERVICE_URL_WEB}
      PUBLIC_API_URL: ${SERVICE_URL_API}
      PUBLIC_UPLOAD_URL: ${SERVICE_URL_UPLOAD}/files/
      PUBLIC_FILES_URL: ${SERVICE_URL_FILES}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAIL_SHARE_DAILY_LIMIT: ${MAIL_SHARE_DAILY_LIMIT:-10}
      SIGN_REQUEST_DAILY_LIMIT: ${SIGN_REQUEST_DAILY_LIMIT:-20}
      DISK_MAX_USAGE_PERCENT: ${DISK_MAX_USAGE_PERCENT:-85}
      DISK_MIN_FREE_GB: ${DISK_MIN_FREE_GB:-20}
      DISK_RESERVE_FACTOR: ${DISK_RESERVE_FACTOR:-3}
      QUEUE_MAX_WAIT_SECONDS_PDF: ${QUEUE_MAX_WAIT_SECONDS_PDF:-120}
      CLIENT_MAX_MB: ${CLIENT_MAX_MB:-100}
      FILE_TTL_ANON_MINUTES: ${FILE_TTL_ANON_MINUTES:-60}
      FILE_TTL_USER_HOURS: ${FILE_TTL_USER_HOURS:-24}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-1073741824}
      DOWNLOAD_TOKEN_MINUTES: ${DOWNLOAD_TOKEN_MINUTES:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      ANON_TOKENS_PER_IP_DAY: ${ANON_TOKENS_PER_IP_DAY:-10}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-true}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-100000000}
      RENDER_MAX_PIXELS: ${RENDER_MAX_PIXELS:-50000000}
      GOTENBERG_URL: http://gotenberg:3000
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Correo del administrador}
      HEVC_DECODE_ENABLED: ${HEVC_DECODE_ENABLED:-false}
      INVOICING_ES_ENABLED: ${INVOICING_ES_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:?URL SMTP}
      MAIL_FROM: ${MAIL_FROM:?Remitente}
      LLM_PREFERRED_MODELS: ${LLM_PREFERRED_MODELS:-}
      LLM_FALLBACK_ROUTER: ${LLM_FALLBACK_ROUTER:-openrouter/free}
      LLM_MODELS_REFRESH_HOURS: ${LLM_MODELS_REFRESH_HOURS:-6}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-950}
      AI_PRO_RESERVE: ${AI_PRO_RESERVE:-400}
      AI_RPM_LIMIT: ${AI_RPM_LIMIT:-18}
      AI_BUDGET_RESET_TZ: ${AI_BUDGET_RESET_TZ:-UTC}
      AI_REQUIRE_CONSENT: 'true'
      AI_CHAT_RPM_SHARE: ${AI_CHAT_RPM_SHARE:-0.5}
      AI_TASK_MAX_REQUESTS: ${AI_TASK_MAX_REQUESTS:-20}
      TTS_ENGINE: ${TTS_ENGINE:-kokoro}
      TTS_VOICE_ES: ${TTS_VOICE_ES:-}
      TTS_VOICE_EN: ${TTS_VOICE_EN:-af_heart}
      SEAL_ENABLED: ${SEAL_ENABLED:-true}
      SERVICE_URL_API_8000: ''
      SERVICE_ROLE: api
      DATABASE_URL: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/conversor
      VALKEY_URL: redis://default:${SERVICE_PASSWORD_VALKEY}@valkey:6379/0
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks
      FILE_TOKEN_SECRET: ${SERVICE_PASSWORD_64_FILES}
      ANON_TOKEN_SECRET: ${SERVICE_PASSWORD_64_ANON}
      JOB_SECRETS_KEY: ${SERVICE_PASSWORD_64_JOBSECRETS}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Clave secreta de Turnstile}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
    volumes: &id003
    - filestore:/srv/files
    networks:
    - internal
    - edge
    mem_limit: 1g
    memswap_limit: 1g
    cpu_shares: 2048
    oom_score_adj: -500
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=64m
    depends_on: &id002
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  apiint:
    image: ghcr.io/${GHCR_OWNER:?Propietario del registro}/conversor-api:${IMAGE_TAG:?Etiqueta de imagen}
    restart: unless-stopped
    logging: *id001
    command:
    - uvicorn
    - app.internal.app:app
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    - --no-server-header
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:?Nombre del producto}
      PUBLIC_WEB_URL: ${SERVICE_URL_WEB}
      PUBLIC_API_URL: ${SERVICE_URL_API}
      PUBLIC_UPLOAD_URL: ${SERVICE_URL_UPLOAD}/files/
      PUBLIC_FILES_URL: ${SERVICE_URL_FILES}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAIL_SHARE_DAILY_LIMIT: ${MAIL_SHARE_DAILY_LIMIT:-10}
      SIGN_REQUEST_DAILY_LIMIT: ${SIGN_REQUEST_DAILY_LIMIT:-20}
      DISK_MAX_USAGE_PERCENT: ${DISK_MAX_USAGE_PERCENT:-85}
      DISK_MIN_FREE_GB: ${DISK_MIN_FREE_GB:-20}
      DISK_RESERVE_FACTOR: ${DISK_RESERVE_FACTOR:-3}
      QUEUE_MAX_WAIT_SECONDS_PDF: ${QUEUE_MAX_WAIT_SECONDS_PDF:-120}
      CLIENT_MAX_MB: ${CLIENT_MAX_MB:-100}
      FILE_TTL_ANON_MINUTES: ${FILE_TTL_ANON_MINUTES:-60}
      FILE_TTL_USER_HOURS: ${FILE_TTL_USER_HOURS:-24}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-1073741824}
      DOWNLOAD_TOKEN_MINUTES: ${DOWNLOAD_TOKEN_MINUTES:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      ANON_TOKENS_PER_IP_DAY: ${ANON_TOKENS_PER_IP_DAY:-10}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-true}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-100000000}
      RENDER_MAX_PIXELS: ${RENDER_MAX_PIXELS:-50000000}
      GOTENBERG_URL: http://gotenberg:3000
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Correo del administrador}
      HEVC_DECODE_ENABLED: ${HEVC_DECODE_ENABLED:-false}
      INVOICING_ES_ENABLED: ${INVOICING_ES_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:?URL SMTP}
      MAIL_FROM: ${MAIL_FROM:?Remitente}
      SERVICE_ROLE: apiint
      DATABASE_URL: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/conversor
      VALKEY_URL: redis://default:${SERVICE_PASSWORD_VALKEY}@valkey:6379/0
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks
      FILE_TOKEN_SECRET: ${SERVICE_PASSWORD_64_FILES}
      ANON_TOKEN_SECRET: ${SERVICE_PASSWORD_64_ANON}
      BACKUP_PATH: /srv/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      BACKUP_RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
    volumes:
    - filestore:/srv/files
    - backups:/srv/backups
    networks:
    - internal
    - edge
    mem_limit: 1g
    memswap_limit: 1g
    cpu_shares: 2048
    oom_score_adj: -500
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=256m
    depends_on: *id002
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=5).status==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  beat:
    image: ghcr.io/${GHCR_OWNER:?Propietario del registro}/conversor-api:${IMAGE_TAG:?Etiqueta de imagen}
    restart: unless-stopped
    logging: *id001
    command:
    - celery
    - -A
    - core.celeryapp
    - worker
    - -B
    - -Q
    - maintenance
    - --pool
    - solo
    - -n
    - beat@%h
    - --pidfile
    - /tmp/beat.pid
    - -s
    - /tmp/celerybeat-schedule
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:?Nombre del producto}
      PUBLIC_WEB_URL: ${SERVICE_URL_WEB}
      PUBLIC_API_URL: ${SERVICE_URL_API}
      PUBLIC_UPLOAD_URL: ${SERVICE_URL_UPLOAD}/files/
      PUBLIC_FILES_URL: ${SERVICE_URL_FILES}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAIL_SHARE_DAILY_LIMIT: ${MAIL_SHARE_DAILY_LIMIT:-10}
      SIGN_REQUEST_DAILY_LIMIT: ${SIGN_REQUEST_DAILY_LIMIT:-20}
      DISK_MAX_USAGE_PERCENT: ${DISK_MAX_USAGE_PERCENT:-85}
      DISK_MIN_FREE_GB: ${DISK_MIN_FREE_GB:-20}
      DISK_RESERVE_FACTOR: ${DISK_RESERVE_FACTOR:-3}
      QUEUE_MAX_WAIT_SECONDS_PDF: ${QUEUE_MAX_WAIT_SECONDS_PDF:-120}
      CLIENT_MAX_MB: ${CLIENT_MAX_MB:-100}
      FILE_TTL_ANON_MINUTES: ${FILE_TTL_ANON_MINUTES:-60}
      FILE_TTL_USER_HOURS: ${FILE_TTL_USER_HOURS:-24}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-1073741824}
      DOWNLOAD_TOKEN_MINUTES: ${DOWNLOAD_TOKEN_MINUTES:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      ANON_TOKENS_PER_IP_DAY: ${ANON_TOKENS_PER_IP_DAY:-10}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-true}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-100000000}
      RENDER_MAX_PIXELS: ${RENDER_MAX_PIXELS:-50000000}
      GOTENBERG_URL: http://gotenberg:3000
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Correo del administrador}
      HEVC_DECODE_ENABLED: ${HEVC_DECODE_ENABLED:-false}
      INVOICING_ES_ENABLED: ${INVOICING_ES_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:?URL SMTP}
      MAIL_FROM: ${MAIL_FROM:?Remitente}
      LLM_PREFERRED_MODELS: ${LLM_PREFERRED_MODELS:-}
      LLM_FALLBACK_ROUTER: ${LLM_FALLBACK_ROUTER:-openrouter/free}
      LLM_MODELS_REFRESH_HOURS: ${LLM_MODELS_REFRESH_HOURS:-6}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-950}
      AI_PRO_RESERVE: ${AI_PRO_RESERVE:-400}
      AI_RPM_LIMIT: ${AI_RPM_LIMIT:-18}
      AI_BUDGET_RESET_TZ: ${AI_BUDGET_RESET_TZ:-UTC}
      AI_REQUIRE_CONSENT: 'true'
      AI_CHAT_RPM_SHARE: ${AI_CHAT_RPM_SHARE:-0.5}
      AI_TASK_MAX_REQUESTS: ${AI_TASK_MAX_REQUESTS:-20}
      SERVICE_ROLE: beat
      DATABASE_URL: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/conversor
      VALKEY_URL: redis://default:${SERVICE_PASSWORD_VALKEY}@valkey:6379/0
      FILE_TOKEN_SECRET: ${SERVICE_PASSWORD_64_FILES}
    volumes: *id003
    networks:
    - internal
    - edge
    mem_limit: 512m
    memswap_limit: 512m
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=16m
    depends_on: *id002
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 $$(cat /tmp/beat.pid)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
  upload:
    image: tusproject/tusd:v2.10.1
    restart: unless-stopped
    logging: *id001
    user: 10001:10001
    environment:
      SERVICE_URL_UPLOAD_8080: ''
    command:
    - -host=0.0.0.0
    - -port=8080
    - -base-path=/files/
    - -upload-dir=/srv/files/uploads
    - -behind-proxy
    - -disable-download
    - -max-size=${UPLOAD_MAX_BYTES:-1073741824}
    - -hooks-http=http://apiint:8001/tusd-hooks
    - -hooks-http-forward-headers=Authorization,Accept-Language,CF-Connecting-IP,X-Forwarded-For
    - -hooks-enabled-events=pre-create,pre-finish,post-terminate
    - -cors-allow-origin=^${SERVICE_URL_WEB}$
    - -cors-allow-headers=Authorization,Accept-Language
    volumes: *id003
    networks:
    - internal
    mem_limit: 256m
    memswap_limit: 256m
    cpu_shares: 2048
    oom_score_adj: -500
    depends_on:
      apiint:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/metrics
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  files:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *id001
    user: 10001:10001
    environment:
      SERVICE_URL_FILES_8090: ''
      PUBLIC_WEB_URL: ${SERVICE_URL_WEB}
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    command:
    - caddy
    - run
    - --config
    - /etc/caddy/Caddyfile
    - --adapter
    - caddyfile
    volumes:
    - filestore:/srv/files:ro
    - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
    - internal
    read_only: true
    tmpfs:
    - /tmp:size=16m
    mem_limit: 256m
    memswap_limit: 256m
    cpu_shares: 2048
    oom_score_adj: -500
    depends_on:
      apiint:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8090/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    restart: unless-stopped
    logging: *id001
    command:
    - gotenberg
    - --api-timeout=300s
    - --log-format=json
    - --libreoffice-restart-after=10
    - --chromium-restart-after=10
    - --chromium-deny-public-ips=true
    - --chromium-deny-private-ips=true
    - --libreoffice-deny-public-ips=true
    - --libreoffice-deny-private-ips=true
    - --api-download-from-deny-public-ips=true
    - --api-download-from-deny-private-ips=true
    - --webhook-deny-public-ips=true
    - --webhook-deny-private-ips=true
    networks:
    - internal
    mem_limit: ${MEM_GOTENBERG:-3g}
    memswap_limit: ${MEM_GOTENBERG:-3g}
    cpus: 2
    oom_score_adj: 500
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  gotenbergweb:
    image: gotenberg/gotenberg:8.39.0
    restart: unless-stopped
    logging: *id001
    command:
    - gotenberg
    - --api-timeout=180s
