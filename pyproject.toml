[project]
name = "conversor"
version = "0.1.0"
description = "Herramientas PDF y conversor de archivos: API, núcleo y workers"
requires-python = ">=3.12,<3.14"
license = { text = "Propietaria" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "celery==5.6.3",
  "redis==8.1.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "pyyaml==6.0.3",
  "defusedxml==0.7.1",
  "python-multipart==0.0.33",
  "stripe==16.1.0",
]

[project.optional-dependencies]
# hacer-pdf-rellenable (F4-B1): pyHanko (MIT) crea los campos de firma; workerpdf no firma ni tiene el token.
pdf = ["pikepdf==10.17.0", "pypdfium2==5.14.0", "pillow==13.0.0", "img2pdf==0.6.3", "pyHanko==0.38.1", "pyhanko-certvalidator==0.33.0"]
office = [
  "pikepdf==10.17.0",
  "pypdfium2==5.14.0",
  "pillow==13.0.0",
  "img2pdf==0.6.3",
  # markdown-a-pdf y txt-a-pdf (A.8)
  "markdown-it-py==4.2.0",
  "mdit-py-plugins==0.6.1",
  "pygments==2.21.0",
  "charset-normalizer==3.5.2",
]
# imagen-a-texto (F3, lote C): img2pdf (LGPL, ya lo trae OCRmyPDF) pasa las imágenes a PDF y python-docx escribe el DOCX.
# factur-x: pdf-a-factura-electronica (F4-E3) incrusta el XML con los metadatos de Factur-X tras pasar el PDF a PDF/A-3.
ocr = ["ocrmypdf==17.13.0", "pikepdf==10.17.0", "pypdfium2==5.14.0", "pillow==13.0.0", "img2pdf==0.6.3", "python-docx==1.2.0", "factur-x==7.9"]
# workermedia (F2, lote C): cómics, DjVu, HEIC, correo y DXF. Nunca extract-msg (GPL), PyMuPDF ni ezdxf[draw] (AGPL).
media = [
  "pikepdf==10.17.0",
  "pypdfium2==5.14.0",
  "pillow==13.0.0",
  "img2pdf==0.6.3",
  "libarchive-c==5.3",
  "ezdxf==1.4.5",
  "olefile==0.47",
  "compressed-rtf==1.0.7",
  "nh3==0.3.7",
  # F5, lote C: RAW (LibRaw en rawpy, sin los demosaicos GPL), PSD, vectorizar y quitar fondo (rembg con su modelo
  # descargado al construir; nunca bria-rmbg, D-96).
  "rawpy==0.27.1",
  "psd-tools==1.26.0",
  "vtracer==0.6.15",
  "rembg==2.0.86",
  "onnxruntime==1.31.0",
  "pymatting==1.1.16",
  "numba==0.68.0",
  "scikit-image==0.26.0",
]
convert = [
  "docling==2.145.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  "lxml==6.1.3",
  "pikepdf==10.17.0",
  "pypdfium2==5.14.0",
  "pillow==13.0.0",
]
# workerav (F5, lote E): transcripción local con faster-whisper. Se instala con `--override infra/uv-overrides.txt`, que
# quita PyAV (sus ruedas traen x264 y x265, GPL; D-111): el audio lo decodifica el FFmpeg LGPL de la imagen, aparte.
# F3, lote D (pdf-a-audio): onnxruntime para Kokoro (6.4) y pypdfium2 y pikepdf para el texto del PDF. Nunca kokoro,
# kokoro-onnx, misaki ni phonemizer-fork: cargarían espeak-ng (GPL) dentro del proceso (11).
av = ["faster-whisper==1.2.1", "ctranslate2==4.8.5", "python-docx==1.2.0", "onnxruntime==1.31.0", "pypdfium2==5.14.0", "pillow==13.0.0",
      "pikepdf==10.17.0"]
# IA (F3): texto de los PDF y resultados en DOCX; las peticiones van con httpx (dependencia común). openpyxl (MIT) escribe
# los XLSX de imagen-a-excel y ticket-a-excel (F3, lote C). pysubs2 (MIT, Python puro y sin dependencias) lee y escribe
# los SRT, VTT y ASS de traducir-subtitulos (F3, lote E); se adelanta de F6 (7.13), donde también lo usará utils.
ai = ["pikepdf==10.17.0", "pypdfium2==5.14.0", "python-docx==1.2.0", "python-pptx==1.0.2", "pillow==13.0.0", "fastembed==0.9.1",
      "onnxruntime==1.31.0", "openpyxl==3.1.5", "pysubs2==1.9.1"]
# Firma (F4, lote A): pyHanko y pyhanko-certvalidator (MIT) con PKCS#11 (python-pkcs11, MIT; el extra de pyHanko pide la
# 0.9.x), imágenes y fuentes OpenType para la firma visible y `etsi` (xsdata y signxml, MIT y Apache-2.0) para leer la
# lista de confianza de la UE. Nunca xmlsig (AGPL, 11).
# verificar-firma (F6-G, D-219): signxml y lxml, las versiones de `utils`, para las firmas XAdES en `sign.verify`.
sign = ["pyHanko[pkcs11,image-support,opentype,etsi]==0.38.1", "pyhanko-certvalidator==0.33.0", "python-pkcs11==0.9.5",
        "pikepdf==10.17.0", "pypdfium2==5.14.0", "pillow==13.0.0", "signxml==5.3.0", "lxml==6.1.3"]
# Facturas electrónicas (F4, lote D; grupo utils): factur-x (BSD; trae los XSD y el Schematron oficiales de Factur-X
# 1.09, que usan los escenarios propios de KoSIT), lxml y signxml (Apache-2.0) para Facturae y su firma XAdES; nunca
# xmlsig (AGPL, 11). KoSIT es Java y va como programa aparte dentro de la imagen.
# F6-B (D-213): openpyxl (MIT) para xlsx-a-csv, csv-a-xlsx y excel-a-json y charset-normalizer (MIT) para los CSV; las
# mismas versiones que en los extras `convert` y `office`. PyYAML y defusedxml ya son dependencias comunes.
utils = ["factur-x==7.9", "lxml==6.1.3", "signxml==5.3.0", "pikepdf==10.17.0", "pypdfium2==5.14.0", "pillow==13.0.0",
         "openpyxl==3.1.5", "charset-normalizer==3.5.2",
         # F6-F (D-215): fuentes con fontTools (MIT) y brotli (MIT) para WOFF2.
         "fonttools==4.68.0", "brotli==1.2.1",
         # F6-E (D-217): libarchive-c (CC0) sobre libarchive13 del sistema y pysubs2 (MIT), las versiones de `media` y `ai`.
         "libarchive-c==5.3", "pysubs2==1.9.1",
         # F6-G (D-219): asn1crypto (MIT) lee los CMS de csig-a-pdf y p7m-a-pdf; la versión que trae pyHanko en `sign`.
         "asn1crypto==1.5.1",
         # F6-H1 (D-220): gpxpy (Apache-2.0) lee y escribe GPX; los Shapefile van con ogr2ogr externo (gdal-bin, MIT).
         "gpxpy==1.6.2",
         # F6-H2 (D-223): fitparse (MIT) lee los FIT de los relojes y ciclocomputadores.
         "fitparse==1.2.0",
         # F6-I (D-224): vobject (Apache-2.0) para vCard e icalendar (BSD-2-Clause) para iCalendar.
         "vobject==0.9.9", "icalendar==7.3.0"]
# workermesh (F7-A, D-244): trimesh (MIT) para STL, OBJ y PLY y lib3mf (BSD-2-Clause) para 3MF; numpy, scipy y networkx
# (BSD) son las dependencias que usa trimesh al leer y fusionar vértices.
# F7-B (D-248): pyassimp (ISC, ctypes) sobre libassimp5 del sistema (BSD-3-Clause) para FBX, DAE y 3DS, en un proceso hijo.
mesh = ["trimesh==5.2.1", "lib3mf==2.5.0", "numpy==2.5.4", "scipy==1.18.1", "networkx==3.7", "lxml==6.1.3", "pillow==13.0.0",
        "pyassimp==5.2.5",
        # F7-C (D-250): usd-core (LicenseRef-TOST-1.0, permitido en 11) para USD y USDZ.
        "usd-core==26.11"]
# fpdf2 (LGPL-3.0) solo genera muestras de prueba en scripts/fixtures (1.8); nunca llega a una imagen. certomancer (MIT)
# hace la PKI de pruebas de F4 (CA, TSA, OCSP y CRL, dobles de 0.1) en las pruebas y en el Compose de desarrollo.
dev = ["pytest==9.2.0", "respx==0.23.1", "pip-licenses==5.0.0", "fpdf2==2.9.0", "certomancer[web-api]==0.16.0"]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/tools", "apps/api"]
testpaths = ["tests"]
markers = [
  "integration: necesita servicios locales (PostgreSQL y Valkey/Redis)",
  "needs_tesseract: necesita Tesseract instalado",
  "needs_docling: necesita Docling instalado (imagen convert)",
  "needs_soffice: necesita LibreOffice instalado",
]
filterwarnings = ["ignore::DeprecationWarning"]
